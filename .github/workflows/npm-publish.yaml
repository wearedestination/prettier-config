name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read


jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version check
        run: |
          package_json_version=$(node -e 'console.log(require("./package.json").version)')
          if [ "v$package_json_version" != $GITHUB_REF_NAME ]; then
            echo "Version in package.json (v$package_json_version) does not match the tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
      - run: |
          npm install
          major=$(node -e 'console.log(require("./package.json").version.split(".")[0])')
          latest_major=$(npm view "$(node -e 'console.log(require("./package.json").name)')" version | cut -d. -f1)
          if [ "$major" -ge "$latest_major" ]; then
            npm publish --access=public
          else
            npm publish --access=public --tag legacy
          fi
